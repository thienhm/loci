name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bun-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

  rust-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build -p loci-cli --release --locked

      - name: Test release packaging helper
        run: bun test scripts/package-rust-cli.test.ts

      - name: Smoke-test release binary
        run: ./target/release/loci --help

      - name: Smoke-test release packaging
        run: |
          scripts/package-rust-cli.sh \
            --target x86_64-unknown-linux-gnu \
            --binary target/release/loci \
            --out-dir dist/ci
          mkdir -p dist/ci-smoke
          tar -C dist/ci-smoke -xzf dist/ci/loci-x86_64-unknown-linux-gnu.tar.gz
          dist/ci-smoke/loci/loci --help
